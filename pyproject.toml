[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learned-dynamics-and-symmetry"
version = "0.1.0"
description = "Supervised learning of raw robot dynamics under different input canonicalizations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "torch",
    "matplotlib",
    "pandas",
    "plotly",
    "pillow",
    "jupyter",
    "ipykernel",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["learned_dynamics*", "unicycle*", "quadrotor*"]
exclude = [
    "quadrotor.idsia.nanodrone-sysid-benchmark*",
    "quadrotor.idsia.out*",
]

[tool.setuptools.package-dir]
learned_dynamics = "src/learned_dynamics"
